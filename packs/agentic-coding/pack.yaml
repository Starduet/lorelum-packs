name: agentic-coding
version: 0.8.0
description: "Decision-focused Practices for AI agents doing software engineering. When reporting a diagnosis, design choice, implementation result, or progress to a developer, put the engineering conclusion and its important limits first; explain component actions and their effects instead of process logs, abstract labels, or unexplained project jargon. Before continuing a long discussion or starting its next phase, consider whether accumulated history still serves the intended work; when completed investigations, unrelated tasks, or superseded plans dominate, query session-handoff guidance to decide whether a fresh conversation would help. When safeguards, coordination rules, or internal metrics displace a concrete way to solve the task, retrieve guidance on organizing work around a working solution. Clarify goals, authority, acceptance, and non-goals; control scope and stop conditions; keep plans and standards from growing past what they must decide; justify new validation, preflight checks, permission confirmations, integrity scans, and startup or repair prerequisites BEFORE deciding to implement them, including precautions an agent proposes during ordinary backend and local-service tasks; assign checks to their owning boundaries and keep combined acceptance paths completable without weakening security, consistency, or contracts; review subtractively before commit; and handle handoffs, delegation, delivery, recovery, and context loss with trustworthy evidence."
