schema_version: 1
name: lorelum-official
description: Official Knowledge Packs maintained by the Lorelum project.
packs:
  - name: agentic-coding
    description: "Decision-focused Practices for AI agents doing software engineering: clarify goals and authority, control scope and investigation, make proportionate implementation and validation choices, and handle reviews, delivery, handoffs, and recovery with trustworthy evidence."
    releases:
      - version: 0.1.0
        ref: agentic-coding-v0.1.0
        path: packs/agentic-coding
      - version: 0.2.0
        ref: agentic-coding-v0.2.0
        path: packs/agentic-coding
      - version: 0.3.0
        ref: agentic-coding-v0.3.0
        path: packs/agentic-coding
      - version: 0.3.1
        ref: agentic-coding-v0.3.1
        path: packs/agentic-coding
  - name: pack-creator
    description: Practices for creating atomic, retrievable, reviewable, and verifiably published Lorelum Knowledge Packs.
    releases:
      - version: 0.1.0
        ref: pack-creator-v0.1.0
        path: packs/pack-creator
  - name: react-web-craft
    description: Practices for React web application design and performance across component state, async data flow, loading, rendering, and component composition.
    releases:
      - version: 0.1.0
        ref: react-web-craft-v0.1.0
        path: packs/react-web-craft
