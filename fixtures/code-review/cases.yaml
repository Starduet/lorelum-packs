fixture_set: code-review-cases
evaluation_only: true
description: >-
  Synthetic, independently authored review scenarios for evaluating the eight code-review
  Practices. Contracts and surrounding behavior are assumptions of each case, not claims
  about a real repository or AACR. Diffs use illustrative paths and line numbers. A positive
  case expects a finding on the changed line; its paired negative case must not produce
  the specified finding. These are evaluation hypotheses, not runtime instructions or
  evidence of retrieval or review quality.
cases:
  - id: side-effect-failure-positive
    practice: code-review.side-effects.isolate-noncritical-failures
    kind: positive
    contract: Saving a document succeeds even when optional thumbnail generation fails.
    context: save commits before returning; thumbnail raises on unavailable image service; uncaught exceptions cause the Java endpoint to return 503.
    diff: |
      --- a/DocumentController.java
      +++ b/DocumentController.java
      @@ -40,2 +40,3 @@
       Document doc = save(request);
      +thumbnail.generate(doc.id());  // line 41
       return created(doc);
    expected_finding:
      location: DocumentController.java:41
      observation: A thumbnail outage makes an already saved document appear to have failed.
      minimum_evidence: The commit precedes the throwing optional call and uncaught exception becomes 503.
  - id: side-effect-failure-negative
    practice: code-review.side-effects.isolate-noncritical-failures
    kind: negative
    contract: Saving a document succeeds even when optional thumbnail generation fails.
    context: offerThumbnail never throws or blocks and reports dropped work separately; save commits before returning.
    diff: |
      --- a/DocumentController.java
      +++ b/DocumentController.java
      @@ -40,2 +40,3 @@
       Document doc = save(request);
      +offerThumbnail(doc.id());  // line 41
       return created(doc);
    expected_no_finding: The specified thumbnail outage cannot alter the saved document response.

  - id: llm-usage-positive
    practice: code-review.llm.account-for-all-usage
    kind: positive
    contract: Each attempt must retain its provider identity and usage for provider-specific reconciliation.
    context: Both providers can report usage on a failed attempt; ledger.add stores only the supplied record and no other accounting runs.
    diff: |
      --- a/generate.go
      +++ b/generate.go
      @@ -21,3 +21,6 @@
       result := providerA.Call(ctx)
      +if result.Retryable {
      +    result = providerB.Call(ctx) // line 23
      +}
       ledger.Add(result.Provider, result.Usage)
       return result
    expected_finding:
      location: generate.go:23
      observation: Fallback replaces provider A's potentially billable usage before it is recorded.
      minimum_evidence: Provider A can return usage and only the last result reaches the ledger.
  - id: llm-usage-negative
    practice: code-review.llm.account-for-all-usage
    kind: negative
    contract: Each provider attempt must retain its identity and usage for reconciliation.
    context: callAndRecord writes each result to the ledger before returning, including retryable results.
    diff: |
      --- a/generate.go
      +++ b/generate.go
      @@ -21,2 +21,5 @@
       result := providerA.CallAndRecord(ctx)
      +if result.Retryable {
      +    result = providerB.CallAndRecord(ctx) // line 23
      +}
       return result
    expected_no_finding: The first provider's usage is recorded before its local result is replaced.

  - id: cancellation-positive
    practice: code-review.async.preserve-task-cancellation
    kind: positive
    contract: A disconnected request must stop its polling worker before request cleanup.
    context: The Go worker loops forever; readNext does not accept a context and may wait indefinitely. No other owner stops the worker.
    diff: |
      --- a/handler.go
      +++ b/handler.go
      @@ -12,2 +12,5 @@
      +go func() { // line 12
      +    for { readNext() }
      +}()
       <-request.Context().Done()
       return
    expected_finding:
      location: handler.go:12
      observation: The goroutine keeps polling or blocked after the request is cancelled and cleanup returns.
      minimum_evidence: The worker does not observe cancellation and no other owner can terminate it.
  - id: cancellation-negative
    practice: code-review.async.preserve-task-cancellation
    kind: negative
    contract: A disconnected request must stop its polling worker before request cleanup.
    context: readNextWithContext returns when its context is cancelled; done closes when the worker exits.
    diff: |
      --- a/handler.go
      +++ b/handler.go
      @@ -12,2 +12,4 @@
      +go poll(request.Context(), done)
       <-request.Context().Done()
      +<-done // line 14
       return
    expected_no_finding: The worker receives cancellation and the request waits for its exit.

  - id: terminal-state-positive
    practice: code-review.state.prevent-stale-terminal-overwrites
    kind: positive
    contract: A job that reaches cancelled or completed is terminal; an older progress callback must never change its state back to running.
    context: A callback reads a job, then an independent cancellation transaction can commit before the callback's update; update_state writes unconditionally by id.
    diff: |
      --- a/jobs.py
      +++ b/jobs.py
      @@ -30,2 +30,3 @@
       job = load_job(job_id)
      +update_state(job.id, 'running')  # new line 31
       publish_progress(job.id)
    expected_finding:
      location: jobs.py:31
      observation: A delayed callback can overwrite a concurrently committed cancelled or completed state with running.
      minimum_evidence: The stale read, possible terminal transition, and unconditional update establish the specific interleaving.
  - id: terminal-state-negative
    practice: code-review.state.prevent-stale-terminal-overwrites
    kind: negative
    contract: A cancelled or completed job must never return to running.
    context: compare_and_set_state performs one atomic database update conditioned on the current state being queued or running; terminal states cannot match.
    diff: |
      --- a/jobs.py
      +++ b/jobs.py
      @@ -30,2 +30,3 @@
       job = load_job(job_id)
      +compare_and_set_state(job.id, from_states=['queued', 'running'], to='running')  # new line 31
       publish_progress(job.id)
    expected_no_finding: Do not report a stale terminal overwrite; the state predicate is checked atomically at the write.

  - id: critical-section-positive
    practice: code-review.concurrency.protect-critical-sections
    kind: positive
    contract: At most one request may reserve the final unit of a SKU; inventory is shared across threads.
    context: All reservations use this lock; available and decrement access the same in-memory counter and neither operation locks internally.
    diff: |
      --- a/inventory.py
      +++ b/inventory.py
      @@ -10,4 +10,4 @@
       with inventory_lock:
           enough = available(sku) > 0
      -    if enough: decrement(sku)
      +if enough: decrement(sku)  # new line 12
       return enough
    expected_finding:
      location: inventory.py:12
      observation: Two requests can both observe the last unit under the lock before either decrements outside it, so both reservations succeed.
      minimum_evidence: The read and write are separated by lock release, and both operate on the shared counter.
  - id: critical-section-negative
    practice: code-review.concurrency.protect-critical-sections
    kind: negative
    contract: At most one request may reserve the final unit of a SKU.
    context: reserve_atomic checks availability and decrements in a single atomic database statement shared by every reservation path; the removed lock was process-local.
    diff: |
      --- a/inventory.py
      +++ b/inventory.py
      @@ -10,2 +10,1 @@
      -with inventory_lock: return reserve_atomic(sku)
      +return reserve_atomic(sku)  # new line 10
    expected_no_finding: Do not infer an oversell solely from removing the local lock; the shared atomic reservation owns the check and mutation.

  - id: delivery-positive
    practice: code-review.delivery.align-ack-and-idempotency
    kind: positive
    contract: Each completed invoice may trigger only one bank transfer.
    context: The SQS standard queue visibility timeout is 30 seconds; bank transfers can take two minutes and are not idempotent. No worker extends visibility or records a deduplication key.
    diff: |
      --- a/worker.go
      +++ b/worker.go
      @@ -20,1 +20,3 @@
      +transferToBank(message) // line 20
      +sqs.DeleteMessage(message)
       return nil
    expected_finding:
      location: worker.go:20
      observation: A second worker can receive the invoice after visibility expires while the first bank transfer is still in progress, causing a duplicate transfer.
      minimum_evidence: Processing exceeds visibility and neither the transfer nor the worker deduplicates.
  - id: delivery-negative
    practice: code-review.delivery.align-ack-and-idempotency
    kind: negative
    contract: Each completed invoice may trigger only one bank transfer.
    context: The bank atomically deduplicates transfer calls using the invoice ID across all workers and retains the key for the entire redelivery period.
    diff: |
      --- a/worker.go
      +++ b/worker.go
      @@ -20,1 +20,3 @@
      +transferToBank(message, message.InvoiceID) // line 20
      +sqs.DeleteMessage(message)
       return nil
    expected_no_finding: Redelivery can repeat the call but cannot produce a second transfer under the bank's idempotency contract.

  - id: frontend-race-positive
    practice: code-review.frontend.prevent-request-races
    kind: positive
    contract: A project dashboard must show the selected workspace's metrics after switching workspaces.
    context: The query library identifies cached data solely by its key; the fetcher captures workspaceId and returns workspace-specific data.
    diff: |
      --- a/Metrics.tsx
      +++ b/Metrics.tsx
      @@ -10,1 +10,1 @@
      -useQuery({ queryKey: ['metrics', workspaceId], queryFn: loadMetrics });
      +useQuery({ queryKey: ['metrics'], queryFn: loadMetrics }); // line 10
    expected_finding:
      location: Metrics.tsx:10
      observation: Switching workspaces reuses a cache entry for a different workspace and can display the wrong metrics.
      minimum_evidence: The key omits the workspace input while the query result varies by workspace.
  - id: frontend-race-negative
    practice: code-review.frontend.prevent-request-races
    kind: negative
    contract: A project dashboard must show the selected workspace's metrics after switching workspaces.
    context: The query library caches by the complete query key and loadMetrics uses the key's workspace ID.
    diff: |
      --- a/Metrics.tsx
      +++ b/Metrics.tsx
      @@ -10,1 +10,1 @@
      -useQuery({ queryKey: ['metrics'], queryFn: loadMetrics });
      +useQuery({ queryKey: ['metrics', workspaceId], queryFn: loadMetrics }); // line 10
    expected_no_finding: The workspace input now distinguishes the cache entries.

  - id: frontend-cost-positive
    practice: code-review.frontend.control-render-and-load-cost
    kind: positive
    contract: The initial page shows 20 results and must not load or render the remaining records until the user requests another page.
    context: The endpoint supports limit and offset; fetchAll returns every record, and the component renders every result passed to it. The dataset can contain 100,000 records.
    diff: |
      --- a/Results.tsx
      +++ b/Results.tsx
      @@ -8,2 +8,2 @@
      -const results = await fetchPage({ limit: 20, offset: 0 });
      +const results = await fetchAll();  // new line 8
       return <ResultList results={results} />;
    expected_finding:
      location: Results.tsx:8
      observation: Initial load now transfers and renders the entire dataset instead of the requested 20 records, violating the loading contract and increasing work with dataset size.
      minimum_evidence: The changed fetch is unbounded, the renderer consumes all returned records, and the accepted initial-page limit is 20.
  - id: frontend-cost-negative
    practice: code-review.frontend.control-render-and-load-cost
    kind: negative
    contract: The initial page shows 20 results and must not load or render the remaining records until the user requests another page.
    context: fetchPage applies limit and offset server-side; ResultList renders only the supplied records. The mapping is linear in the at-most-20 results.
    diff: |
      --- a/Results.tsx
      +++ b/Results.tsx
      @@ -8,2 +8,2 @@
       const results = await fetchPage({ limit: 20, offset: 0 });
      -return <ResultList results={results} />;
      +return <ResultList results={results.map(toView)} />;  // new line 9
    expected_no_finding: Do not report an unbounded render or dataset-sized initial load; the extra mapping is bounded by the server-side page limit.

  - id: stream-disconnect-positive
    practice: code-review.llm.account-for-all-usage
    kind: positive
    contract: Incurred provider usage must be recorded or marked pending reconciliation even when a client disconnects.
    context: The provider sends usage only at the end; disconnect can happen after billable output. No other process reconciles this request.
    diff: |
      --- a/stream.ts
      +++ b/stream.ts
      @@ -8,2 +8,3 @@
       for await (const event of upstream) {
      +  if (client.closed) return; // line 9
         captureUsage(event);
       }
    expected_finding:
      location: stream.ts:9
      observation: Early return drops the only usage collection path after billable generation.
      minimum_evidence: Billable output precedes disconnect, final usage is unread and no pending record exists.
  - id: stream-disconnect-negative
    practice: code-review.llm.account-for-all-usage
    kind: negative
    contract: Incurred provider usage must be recorded or marked pending reconciliation even when a client disconnects.
    context: markPending durably creates an independently reconciled record for this provider attempt before returning.
    diff: |
      --- a/stream.ts
      +++ b/stream.ts
      @@ -8,2 +8,3 @@
       for await (const event of upstream) {
      +  if (client.closed) { await markPending(attempt); return; } // line 9
         captureUsage(event);
       }
    expected_no_finding: Disconnect leaves a durable record for the required reconciliation.

  - id: lock-order-positive
    practice: code-review.concurrency.protect-critical-sections
    kind: positive
    contract: Transfers and account closure must finish without deadlock.
    context: Both functions run concurrently; closeAccount holds accountLock while acquiring ledgerLock. Locks are non-reentrant and have no timeout.
    diff: |
      --- a/transfer.go
      +++ b/transfer.go
      @@ -10,2 +10,3 @@
       ledgerLock.Lock()
      +accountLock.Lock() // line 11
       transfer()
    expected_finding:
      location: transfer.go:11
      observation: Transfer and closure can each hold one lock while waiting forever for the other.
      minimum_evidence: Concurrent paths acquire the same two locks in opposite order.
  - id: lock-order-negative
    practice: code-review.concurrency.protect-critical-sections
    kind: negative
    contract: Transfers and account closure must finish without deadlock.
    context: closeAccount always acquires ledgerLock before accountLock; both are released after each operation.
    diff: |
      --- a/transfer.go
      +++ b/transfer.go
      @@ -10,2 +10,3 @@
       ledgerLock.Lock()
      +accountLock.Lock() // line 11
       transfer()
    expected_no_finding: Both paths take locks in the same order, excluding the claimed two-lock cycle.

  - id: outbox-atomicity-positive
    practice: code-review.delivery.align-ack-and-idempotency
    kind: positive
    contract: Every committed shipment must have a durable dispatch event.
    context: saveShipment commits immediately; saveOutbox opens and commits a separate transaction; there is no reconciliation scan.
    diff: |
      --- a/shipping.go
      +++ b/shipping.go
      @@ -5,2 +5,3 @@
       saveShipment(shipment)
      +saveOutbox(shipment.ID) // line 6
       return nil
    expected_finding:
      location: shipping.go:6
      observation: A crash between the two commits leaves a shipment with no dispatch event.
      minimum_evidence: The writes commit independently and no recovery reconstructs the missing event.
  - id: outbox-atomicity-negative
    practice: code-review.delivery.align-ack-and-idempotency
    kind: negative
    contract: Every committed shipment must have a durable dispatch event.
    context: tx commits both writes atomically; a worker retries publishing outbox records.
    diff: |
      --- a/shipping.go
      +++ b/shipping.go
      @@ -5,2 +5,3 @@
       tx.saveShipment(shipment)
      +tx.saveOutbox(shipment.ID) // line 6
       return tx.commit()
    expected_no_finding: The shipment and outbox record share the same atomic transaction.

  - id: optional-timeout-positive
    practice: code-review.side-effects.isolate-noncritical-failures
    kind: positive
    contract: Optional recommendations must not delay the profile response past its deadline.
    context: profile is already available; recommendations may hang for minutes; the gateway deadline is five seconds.
    diff: |
      --- a/profile.js
      +++ b/profile.js
      @@ -3,1 +3,2 @@
      +await getRecommendations(user); // line 3
       return profile;
    expected_finding:
      location: profile.js:3
      observation: An optional stalled service can cause the otherwise ready profile response to time out.
      minimum_evidence: The new awaited call can exceed the response deadline.
  - id: optional-timeout-negative
    practice: code-review.side-effects.isolate-noncritical-failures
    kind: negative
    contract: Optional recommendations must not delay the profile response past its deadline.
    context: enqueueRecommendation is local, nonblocking, and never throws; its supervisor owns execution.
    diff: |
      --- a/profile.js
      +++ b/profile.js
      @@ -3,1 +3,2 @@
      +enqueueRecommendation(user); // line 3
       return profile;
    expected_no_finding: The local nonblocking handoff cannot wait for the remote recommendations service.

  - id: promise-rejection-positive
    practice: code-review.async.preserve-task-cancellation
    kind: positive
    contract: Background refresh failures must be sent to the service error reporter.
    context: refresh returns a rejecting promise on a network error; no global rejection handler reports it.
    diff: |
      --- a/refresh.js
      +++ b/refresh.js
      @@ -5,1 +5,2 @@
      +void refresh(); // line 5
       return cached;
    expected_finding:
      location: refresh.js:5
      observation: Rejection is unobserved and bypasses the required error reporter.
      minimum_evidence: The detached promise can reject and has no rejection observer.
  - id: promise-rejection-negative
    practice: code-review.async.preserve-task-cancellation
    kind: negative
    contract: Background refresh failures must be sent to the service error reporter.
    context: report records failures and does not throw.
    diff: |
      --- a/refresh.js
      +++ b/refresh.js
      @@ -5,1 +5,2 @@
      +void refresh().catch(report); // line 5
       return cached;
    expected_no_finding: The rejection is observed and forwarded to the required reporter.

  - id: state-version-positive
    practice: code-review.state.prevent-stale-terminal-overwrites
    kind: positive
    contract: A stale profile enrichment must not overwrite edits made after enrichment starts.
    context: save replaces the entire row unconditionally; another request can increment the version while lookup waits.
    diff: |
      --- a/profile.rb
      +++ b/profile.rb
      @@ -5,2 +5,3 @@
       return unless row.version == expected
       data = lookup_remote()
      +save(row.id, data) # line 7
    expected_finding:
      location: profile.rb:7
      observation: An edit during lookup is overwritten because the version is not checked at the write.
      minimum_evidence: A concurrent version change can occur after the check and save is unconditional.
  - id: state-version-negative
    practice: code-review.state.prevent-stale-terminal-overwrites
    kind: negative
    contract: A stale profile enrichment must not overwrite edits made after enrichment starts.
    context: save_if_version performs one atomic update and rejects rows whose version has changed.
    diff: |
      --- a/profile.rb
      +++ b/profile.rb
      @@ -5,2 +5,3 @@
       return unless row.version == expected
       data = lookup_remote()
      +save_if_version(row.id, expected, data) # line 7
    expected_no_finding: The write atomically rejects a changed version.

  - id: loading-race-positive
    practice: code-review.frontend.prevent-request-races
    kind: positive
    contract: The loading indicator remains visible until the latest request completes.
    context: Requests may overlap; setLoading updates one shared component state and no other guard exists.
    diff: |
      --- a/load.ts
      +++ b/load.ts
      @@ -5,2 +5,3 @@
       try { await fetchData(id); }
      +finally { setLoading(false); } // line 6
       return;
    expected_finding:
      location: load.ts:6
      observation: An older request can finish first and hide the indicator while the newer request is still pending.
      minimum_evidence: Both requests share the same loading state and the finally write has no request guard.
  - id: loading-race-negative
    practice: code-review.frontend.prevent-request-races
    kind: negative
    contract: The loading indicator remains visible until the latest request completes.
    context: latest is incremented whenever a request starts; requestId captures its value.
    diff: |
      --- a/load.ts
      +++ b/load.ts
      @@ -5,2 +5,3 @@
       try { await fetchData(id); }
      +finally { if (requestId === latest) setLoading(false); } // line 6
       return;
    expected_no_finding: Older requests cannot clear loading after a later request starts.

  - id: waterfall-positive
    practice: code-review.frontend.control-render-and-load-cost
    kind: positive
    contract: The checkout screen needs both address and payment options before it can render.
    context: The two API calls use only userId, are uncached, and each waits on an independent remote service.
    diff: |
      --- a/checkout.ts
      +++ b/checkout.ts
      @@ -3,1 +3,2 @@
      +const address = await fetchAddress(userId); // line 3
      +const payment = await fetchPayment(userId);
    expected_finding:
      location: checkout.ts:4
      observation: Payment starts only after the independent address request finishes, adding a network waterfall to checkout.
      minimum_evidence: Neither request uses the other's result and both gate the rendered screen.
  - id: waterfall-negative
    practice: code-review.frontend.control-render-and-load-cost
    kind: negative
    contract: The checkout screen needs both address and payment options before it can render.
    context: fetchPayment requires the region returned by fetchAddress; no cached region exists.
    diff: |
      --- a/checkout.ts
      +++ b/checkout.ts
      @@ -3,1 +3,2 @@
      +const address = await fetchAddress(userId);
      +const payment = await fetchPayment(address.region); // line 4
    expected_no_finding: The second call depends on the first result and cannot start independently.
