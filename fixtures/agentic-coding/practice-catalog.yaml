fixture_set: agentic-coding-practice-catalog
evaluation_only: true
description: Atomic retrieval and behavior hypotheses for the 39 agentic-coding 0.8.0 working-tree Practices, including engineering conclusion reporting and concrete explanations. Unreleased content is not the immutable 37-Practice 0.7.0 release. Not a runtime schema or proof of retrieval quality. Semantic expectation migrations require separate scoring from historical baselines.
entries:
  - id: agentic-coding.implementation.justify-added-checks
    positive_trigger: While planning ordinary startup, the agent proposes the first full installation scan even though no duplicate scan or blocked route exists, without identifying what failure the new I/O would prevent.
    paraphrase: During local HTTP client or authenticated repair work, the agent volunteers another record traversal, executable hash pass, or operator confirmation before deciding what extra protection it provides.
    near_miss: Required malformed-input rejection is settled; only its owning entry point and fact invalidation remain open (validate-at-the-owning-boundary). When all checks and their owners are settled, walk their combined setup, use, and repair prerequisites with keep-acceptance-path-completable.
    nearest_neighbor: agentic-coding.implementation.validate-at-the-owning-boundary
    expected_behavior: Decide before committing or implementing the proposed check, including a spontaneous mid-task addition. Name the reachable failure or mandatory contract, the protection owner, existing guarantees, and any extra protection; compare false rejection, delay, I/O, availability, and recovery costs, then retain, add, narrow, or decline it. A first check can be justified without duplication or a deadlock. Preserve external JSON admission, resource authorization, atomic concurrent-state protection, startup input admission, native/model acceptance, release integrity, and recovery identity where independently required.
    forbidden_behavior: Add a check merely because caution sounds responsible, wait for a final cleanup pass to ask why it exists, or equate calibration with fewer checks. Infer trust from localhost or use a previous parser to remove authorization, concurrency, native/model, release-integrity, or recovery-identity protections.
    # Dedicated query baseline is 3 positives + 2 neighbors; all are hypotheses, not results.

  - id: agentic-coding.implementation.validate-at-the-owning-boundary
    positive_trigger: HTTP and CSV adapters already reject malformed quantities; the remaining decision is where that parsing belongs and whether any internal caller can bypass the established typed contract.
    paraphrase: Trace the actual producer postconditions across a controlled local HTTP handoff, and identify whether decoding, mutation, a different caller, or changed concurrent state invalidates a fact before its next use.
    near_miss: The fact owners are known, but a proposed first scan or extra approval still lacks a reason to exist (justify-added-checks). Once validation is settled, timeout and stale-snapshot choices belong to make-recovery-behavior-explicit, while selecting proving observations belongs to plan-sufficient-evidence.
    nearest_neighbor: agentic-coding.implementation.justify-added-checks
    expected_behavior: Assign each established fact to its actual ingress or invariant owner, carry unchanged facts through controlled internal calls, and recheck when a new caller, mutation, conversion, resource, or concurrent state invalidates them. Preserve decoding, session identity, protocol, and request correlation across controlled HTTP; keep independent external JSON, resource authorization, atomic stock, startup-input, native/model, and release-integrity boundaries.
    forbidden_behavior: Infer trust from localhost, treat every helper as a fresh adversarial ingress, silently renormalize accepted data, or transfer one producer's guarantee to unchecked callers. Delete independent authorization, concurrency, native/model, or release-integrity protections because input parsing already happened; use impossible mock outputs as evidence of a reachable boundary.
    # Fact ownership is distinct from the proposed-check admission decision; neither is a result.

  - id: agentic-coding.implementation.make-recovery-behavior-explicit
    positive_trigger: A client retries a status request three times, its service repeats the call, and a broad catch substitutes an empty list after any failure.
    paraphrase: A supported outage mode permits a five-minute-old snapshot, but decoding failures and permission denials are about to use that fallback too.
    near_miss: No operation has failed; an unchanged typed quantity is being reparsed at each internal handoff.
    nearest_neighbor: agentic-coding.implementation.validate-at-the-owning-boundary
    expected_behavior: Give recovery one owner, classify eligible failures, bound the overall attempts or stale age, preserve material failure information, and deliver the accepted observable outcome.
    forbidden_behavior: Multiply retry budgets, replay a possibly committed mutation blindly, turn failures into empty success, or delete an accepted bounded offline or stale-read behavior as unnecessary complexity.

  - id: agentic-coding.requirements.ground-user-goal
    positive_trigger: A request says to improve failed uploads, and the agent is about to change a generic error banner without stating what creators must be able to do afterward.
    paraphrase: Support staff need to find delayed orders from a customer reference, but the proposed work is only a new badge on an existing dashboard.
    near_miss: The goal already says creators can retry one failed file without resending successful files; only the checks for that result are missing.
    nearest_neighbor: agentic-coding.requirements.define-acceptance-and-non-goals
    expected_behavior: Write the affected person's observable result in one sentence, then reject work that does not advance it.
    forbidden_behavior: Treat the easiest component, document, or green test as the result the user asked for.

  - id: agentic-coding.requirements.resolve-source-authority
    positive_trigger: An adopted policy keeps audit records for seven years, while an older cleanup job and its green tests delete them after one year.
    paraphrase: A migration plan preserves customer IDs, but the current prototype and summary say to generate replacements.
    near_miss: The request, specification, and tests agree on the behavior; the only question is whether an existing helper can implement it.
    nearest_neighbor: agentic-coding.implementation.inspect-and-reuse-existing-capability
    expected_behavior: Record which source controls the disputed behavior, what the other sources merely show, and ask when no rule settles the conflict.
    forbidden_behavior: Let newer prose, detailed tests, or cheaper existing code override an accepted requirement without authority.

  - id: agentic-coding.requirements.define-acceptance-and-non-goals
    positive_trigger: An installer must support the official registry and one explicit repository registry, but neither required path nor nearby platform work has been written down.
    paraphrase: The Git loader makes mirrors, caches, authentication hooks, and generic locators look cheap while a smaller patch could also drop required custom-registry support.
    near_miss: The user has not yet said whether installation is for the official registry, a custom repository, or both.
    nearest_neighbor: agentic-coding.requirements.ground-user-goal
    expected_behavior: List both required install behaviors and name mirror fallback, plugins, aggregation, generic locators, and caching as current non-goals.
    forbidden_behavior: Measure completion by a reusable architecture or small diff that adds unsupported platform work or removes a required path.

  - id: agentic-coding.planning.decide-scope-and-stop-conditions
    positive_trigger: A failed-job alert needs email while an unused multi-channel interface tempts the plan into SMS and push, and the one-filter task sits beside saved-search and suggestion hooks with no recorded finish.
    paraphrase: One repository registry is required, and arbitrary file and network locators are being promoted because they may help later, with no written boundary for when the install task ends.
    near_miss: Implementing the filter has already exposed a public index migration that changes risk and planned checks, so the drift itself is the decision now.
    nearest_neighbor: agentic-coding.implementation.replan-on-material-drift
    expected_behavior: Label each candidate required, optional, out of scope, or unresolved with a current reason, write an observable finish condition per required item, record deferred adjacent opportunities, and name the replanning signals.
    forbidden_behavior: Promote an attractive abstraction, fallback, or future feature into committed work without a current requirement, or continue until the area looks polished with no stable end.

  - id: agentic-coding.planning.scale-work-to-risk-and-cost
    positive_trigger: A webhook signature change can break every receiver, and the plan has not chosen compatibility checks, rollout depth, or a rollback route.
    paraphrase: The team is about to reuse the same broad migration checklist for a reversible color fix and the same light focused test for a live schema change.
    near_miss: Coding has already revealed that a read-only checker would need writes and rollback, so the accepted plan is now stale.
    nearest_neighbor: agentic-coding.implementation.replan-on-material-drift
    expected_behavior: Set investigation, validation, review, and recovery effort from affected users, reversibility, uncertainty, and failure cost.
    forbidden_behavior: Apply one familiar heavy or light delivery template regardless of the actual failure consequences.

  - id: agentic-coding.planning.map-plan-to-user-capability
    positive_trigger: A password-reset plan creates and validates tokens but has no task for updating the password or invalidating old sessions.
    paraphrase: An inventory-transfer plan has an endpoint and confirmation screen but omits reservation in the inventory service, allowing overselling.
    near_miss: The implementation is finished; the open question is which acceptance items the collected test results actually cover.
    nearest_neighbor: agentic-coding.verification.map-evidence-to-acceptance
    expected_behavior: Trace the initiating action through every required service and state change to the observable result, assigning each step an owner.
    forbidden_behavior: Call a set of completed screens, endpoints, or services the complete capability while a required handoff is missing.

  - id: agentic-coding.planning.plan-sufficient-evidence
    positive_trigger: Payment retry must not create a second charge, but the plan contains only unit tests and no observation of gateway idempotency.
    paraphrase: An exported archive must open in an independent consumer, yet the proposed checks stop at static analysis and manual file inspection.
    near_miss: The implementation and checks already exist; their actual coverage now needs to be compared with each acceptance item.
    nearest_neighbor: agentic-coding.verification.map-evidence-to-acceptance
    expected_behavior: Choose the cheapest observation that rules out a plausible failure for each must, state its blind spot, and name when to escalate. Reuse evidence still applicable to the artifact and environment, adding checks for changed risks and unresolved gaps.
    forbidden_behavior: Substitute a long list of convenient checks for evidence at the boundary where the required behavior can fail. Require a full rerun, benchmark, or formal risk report for every edit regardless of what changed.

  - id: agentic-coding.planning.derive-committed-set-from-concerns
    positive_trigger: A team's review standard has grown one entry per incident; a teammate proposes yet another reasonable-sounding dimension, half the existing entries overlap, and nobody has written what the list must actually distinguish.
    paraphrase: The pass criteria for a migration gate keep swinging — items are added until every change drowns in exception arguments, then purged until a bad change slips through — and each adjustment edited the list directly.
    near_miss: The list is settled and every entry traces to a stated concern; the open question is whether an attractive future-use capability should enter the committed plan now.
    nearest_neighbor: agentic-coding.planning.decide-scope-and-stop-conditions
    expected_behavior: Convert the proposal into a concern first and name the judgment it would change, park it if none, merge overlapping entries, and freeze once every concern has an item and every item changes a judgment.
    forbidden_behavior: Admit each item on its own local merits without a stated concern list, keep double-counting entries, or fix dilution and unfairness by directly adding or deleting items.

  - id: agentic-coding.planning.keep-acceptance-path-completable
    positive_trigger: Model admission and inference-readiness checks are required and assigned, but their combined prerequisites leave a fresh installation unable to open setup or a failed initialization unable to enter repair.
    paraphrase: An unattended script cannot answer a required confirmation, independent batch rows inherit a whole-batch abort, or stopping an identified old process depends on its incompatible business API succeeding.
    near_miss: All supported routes already complete and the open question is whether a new scan or confirmation provides any needed protection (justify-added-checks). Repeated checks of an unchanged fact need validate-at-the-owning-boundary; agreed recovery behavior and proving observations belong to make-recovery-behavior-explicit and plan-sufficient-evidence.
    nearest_neighbor: agentic-coding.implementation.justify-added-checks
    expected_behavior: Walk normal, startup, maintenance, and recovery operations through the combination of accepted checks before wiring their prerequisites. Choose operation-specific blocking levels and keep supported setup, offline repair, and identified-old-process stop reachable. Preserve startup input admission, native/model quality, release integrity, and repair identity and permissions; narrow the business-readiness prerequisite rather than bypassing those protections. Preserve unattended completion and attributed per-row outcomes where accepted.
    forbidden_behavior: Compose individually justified checks into an impossible supported task, require successful business initialization to repair that initialization or stop an incompatible process, or retain a confirmation with no supported unattended route. Default to whole-batch rejection despite independent accepted outcomes, or make recovery pass by weakening identity, authorization, artifact integrity, or native/model protections.
    # Combined-path hypotheses do not establish product routing or automatic retrieval.

  - id: agentic-coding.implementation.inspect-and-reuse-existing-capability
    positive_trigger: A new link-normalization helper is about to be written even though another importer already uses a dependency that handles encoded paths and host casing.
    paraphrase: Booking overlap logic is needed, and the scheduling module may already have a tested function with the required endpoint rule.
    near_miss: The repository and dependencies have been checked, and two viable new designs now need a size and reversibility choice.
    nearest_neighbor: agentic-coding.implementation.choose-smallest-sufficient-design
    expected_behavior: Inspect the responsible module and closest candidate, then read a caller or test only if it can change the reuse decision before reusing the behavior or recording why it is unsuitable.
    forbidden_behavior: Reimplement under deadline pressure or keep searching after enough evidence supports a reuse decision.

  - id: agentic-coding.implementation.limit-investigation-to-current-decision
    positive_trigger: A settings-page button and its shared variant are located, along with the color token the variant reads, but the Agent is about to open every Button consumer, old theme migration, and unrelated visual suite merely to gain confidence.
    paraphrase: A bug is isolated to one request handler and its serializer, while the Agent wants to map neighboring endpoints even though none can change the current validation decision.
    near_miss: The Agent has not yet located the target component or symbol and needs a focused search to find the responsible implementation.
    nearest_neighbor: agentic-coding.implementation.inspect-and-reuse-existing-capability
    expected_behavior: Name the unresolved choice, inspect only a direct source that can change the edit, owner, focused check, or need to replan, then stop when those facts are clear.
    forbidden_behavior: Treat broad familiarity, an exhaustive caller map, or the number of files read as evidence that a local change is safe.

  - id: agentic-coding.implementation.surface-unconfirmed-assumptions
    positive_trigger: One importer must choose whether a missing optional description becomes absent or empty, and both forms are currently accepted.
    paraphrase: A sample payload omits an optional label, so one serializer needs a reversible local choice while the schema owner clarifies it.
    near_miss: An accepted specification and current tests disagree about a public value, so choosing either would change intended behavior.
    nearest_neighbor: agentic-coding.requirements.resolve-source-authority
    expected_behavior: Record the local assumption, limit where it applies, and name the source or observation that will confirm or replace it.
    forbidden_behavior: Present the temporary choice as fact or spread it into shared serializers and tests as a new contract.

  - id: agentic-coding.implementation.confirm-product-surface-expansion
    positive_trigger: One order-shipped webhook is approved, but a generic dispatcher tempts the agent to publish arbitrary event names, headers, and plug-in hooks.
    paraphrase: Compact and comfortable display modes are accepted, while the component can also expose unsupported custom spacing tokens.
    near_miss: A background export queue was never part of the accepted download task and would add new failure and recovery behavior.
    nearest_neighbor: agentic-coding.implementation.replan-on-material-drift
    expected_behavior: Confirm the approved public category and expose only the named values or behavior supported by current authority or evidenced risk. Treat a dormant scaffold as implementation evidence and preserve the accepted integration boundary when removing its stale documentation.
    forbidden_behavior: Treat approval of one event, setting, or source as permission for arbitrary extensibility. Infer permission to ship a local transport from a scaffold or from approval of a distinct remote boundary.

  - id: agentic-coding.implementation.choose-smallest-sufficient-design
    positive_trigger: One discount rule can use a direct rule or a configurable plug-in pipeline, and both would satisfy the current request.
    paraphrase: A thumbnail can use a small adapter or a transform graph, while only the adapter avoids a new configuration model.
    near_miss: The implementation is already complete, and the final diff needs unsupported wrappers and helpers removed.
    nearest_neighbor: agentic-coding.review.run-subtractive-review-before-commit
    expected_behavior: Choose the smallest reversible option that fits existing ownership and preserves required errors, limits, and compatibility.
    forbidden_behavior: Add layers, plug-in contracts, or I/O passes because a roadmap hint makes them look future-proof.

  - id: agentic-coding.implementation.preserve-responsibility-boundaries
    positive_trigger: A checkout screen can calculate invoice totals quickly, but refunds and API orders depend on the pricing component's rounding rule.
    paraphrase: API and batch imports both reserve stock, so the no-overselling rule needs one owner rather than copies in each caller.
    near_miss: The pricing component already owns rounding, and the only remaining choice is which internal implementation is smaller.
    nearest_neighbor: agentic-coding.implementation.choose-smallest-sufficient-design
    expected_behavior: Put the invariant in the component that owns it and let each caller translate inputs or presentation concerns.
    forbidden_behavior: Place a shared business rule at the easiest screen or call site, creating different outcomes across entry points.

  - id: agentic-coding.implementation.replan-on-material-drift
    positive_trigger: A synchronous account download now needs temporary files, retries, a queue, and cleanup after a large fixture exceeds the response limit.
    paraphrase: A read-only migration checker would need writes and rollback to repair corrupted records, changing both risk and evidence needs.
    near_miss: A helper was renamed and one file split, but delivery, failure modes, public behavior, and planned checks are unchanged.
    nearest_neighbor: agentic-coding.planning.scale-work-to-risk-and-cost
    expected_behavior: Pause coding, update scope, risk, evidence, and continuation authority, or keep the result within the accepted read-only boundary.
    forbidden_behavior: Accumulate locally useful fixes until a narrow task has silently become a stateful feature with new obligations.

  - id: agentic-coding.testing.anchor-tests-to-requirements
    positive_trigger: Retry-safe job submission gained helpers and status values, and the agent is writing one test per method without testing duplicate submission.
    paraphrase: Resumable upload tests are being chosen, but no one has named restart recovery and non-duplicated bytes as the promises to protect.
    near_miss: A reproduced payment retry bug is understood, and the decision is whether it deserves permanent regression protection.
    nearest_neighbor: agentic-coding.testing.justify-regression-protection
    expected_behavior: Name the requirement, contract, or invariant each new test protects before choosing its assertion.
    forbidden_behavior: Add tests to exercise every new helper or raise coverage while the requested behavior remains unprotected.

  - id: agentic-coding.testing.assert-observable-behavior
    positive_trigger: Revoked access must fail on the next request, but the proposed test only checks the order of cache helper calls.
    paraphrase: A test exists for the right security rule, and the agent must choose between observing request denial and inspecting an internal cache flag.
    near_miss: The agent has not established which user promise or stable contract makes the test necessary.
    nearest_neighbor: agentic-coding.testing.anchor-tests-to-requirements
    expected_behavior: Exercise revocation through supported paths and assert that the next request is denied, independent of cache design.
    forbidden_behavior: Freeze helper order, mock calls, or incidental state that can pass while the user-visible rule fails.

  - id: agentic-coding.testing.classify-failure-before-changing-test
    positive_trigger: A polished UI refactor changes a snapshot and may also have removed required keyboard navigation; updating the snapshot would make the suite green.
    paraphrase: A migration test passes alone but fails after another suite, so product defect, stale expectation, and leaked test state are all plausible.
    near_miss: The user has explicitly changed the required keyboard behavior, so the old expectation is known to follow a superseded baseline.
    nearest_neighbor: agentic-coding.correction.restore-authoritative-baseline
    expected_behavior: Reproduce and classify the failure as product, test, environment, generated-output, or unrelated before choosing any repair.
    forbidden_behavior: Update code, snapshots, fixtures, or gates while multiple causes remain plausible.

  - id: agentic-coding.testing.justify-regression-protection
    positive_trigger: A duplicate payment charge was traced to a serializer dropping its request ID, and a permanent redelivery test is being considered.
    paraphrase: The user removed helper text from one supplied screen, and a cheap global phrase ban is proposed even though no product-wide rule exists.
    near_miss: A failing test has not been reproduced or classified, so the durable behavior and recurrence risk are still unknown.
    nearest_neighbor: agentic-coding.testing.classify-failure-before-changing-test
    expected_behavior: Add lasting protection only for a stable contract or material recurrence risk, and observe the protected outcome rather than helper order.
    forbidden_behavior: Turn a one-screen correction, unclassified failure, or Agent-created behavior into a permanent global prohibition.

  - id: agentic-coding.verification.map-evidence-to-acceptance
    positive_trigger: Booking calculations, build, static checks, and one submission pass, but no result shows that retrying creates only one reservation.
    paraphrase: A report has schema, rendered-page, and phone-download results that need to be matched separately to required fields, readability, and opening.
    near_miss: The map already shows that interrupted download recovery has no evidence, and a close, narrow, or incomplete decision is now required.
    nearest_neighbor: agentic-coding.verification.close-or-declare-evidence-gaps
    expected_behavior: Match each current result to the exact acceptance item it supports and leave every uncovered item visible.
    forbidden_behavior: Treat a green command bundle, build, or successful happy path as proof of the whole capability.

  - id: agentic-coding.verification.bind-evidence-to-artifact-state
    positive_trigger: An archive passed an external compatibility check before serialization cleanup changed the bytes that will be delivered.
    paraphrase: A compiled CLI from commit A installed successfully, but argument parsing changed at commit B and the old binary result is being reused.
    near_miss: The test result is current; the open question is whether a reviewer's recommendation is true and compatible with the requirement.
    nearest_neighbor: agentic-coding.review.validate-findings-before-action
    expected_behavior: Record the artifact, environment, time, and scope of the result, then rerun only when a relevant change invalidates it.
    forbidden_behavior: Cite an old pass for changed code or discard unrelated current evidence because one part became stale.

  - id: agentic-coding.verification.close-or-declare-evidence-gaps
    positive_trigger: A backup archive and checksum exist, but no result restores representative data into a clean database.
    paraphrase: Fresh installation and migration unit tests pass, while no check upgrades a real version-one store and reads its installed Packs afterward.
    near_miss: Results have not yet been compared criterion by criterion, so no specific missing behavior has been established.
    nearest_neighbor: agentic-coding.verification.map-evidence-to-acceptance
    expected_behavior: Run the missing representative check, narrow the promised result, or state that the acceptance item remains incomplete.
    forbidden_behavior: Hide a known restore or upgrade gap behind nearby green checks and an unqualified completion claim.

  - id: agentic-coding.review.validate-findings-before-action
    positive_trigger: A reviewer says to remove required keyboard navigation because pointer tests pass and the event code looks complex.
    paraphrase: A cache-locale finding cites an older diff, and the current branch may already contain the missing locale key.
    near_miss: The finding is accepted as relevant, but the cited test result may no longer apply after a later code change.
    nearest_neighbor: agentic-coding.verification.bind-evidence-to-artifact-state
    expected_behavior: Check the current requirement, artifact, contract, and observations, then mark the finding confirmed, unconfirmed, or authority-dependent.
    forbidden_behavior: Apply confident review advice automatically or dismiss it without checking the current artifact.

  - id: agentic-coding.review.run-subtractive-review-before-commit
    positive_trigger: A final diff keeps a duplicate parser and wrapper while an upstream route guard makes service authorization and recovery state look removable.
    paraphrase: Chunked upload adds a second media validator and unused progress abstraction alongside required size limits and partial-file cleanup.
    near_miss: A new external finding has arrived, and no one has checked whether it is true for the current requirement and artifact.
    nearest_neighbor: agentic-coding.review.validate-findings-before-action
    expected_behavior: Remove unsupported duplication, reuse suitable code, and retain the authorization, recovery, migration, or safety behavior the task needs.
    forbidden_behavior: Optimize line deletion or broad redesign while removing required protection and leaving conventional extras untouched.

  - id: agentic-coding.delivery.claim-only-supported-outcome
    positive_trigger: One queued edit now replays after reconnect, and the agent is about to call the larger offline-sync capability complete.
    paraphrase: Search ranking passes accepted cases on the current index, but no rollout or failover has occurred.
    near_miss: A known acceptance gap still requires more evidence, a narrower target, or an explicit incomplete status before wording the claim.
    nearest_neighbor: agentic-coding.verification.close-or-declare-evidence-gaps
    expected_behavior: Use a completion verb and scope that name only the behavior demonstrated by current evidence.
    forbidden_behavior: Turn one repaired path, local test, installation, publication, or push into a broader success claim.

  - id: agentic-coding.delivery.report-material-residuals
    positive_trigger: A dependency upgrade works for most callers, but two consumers still use the old interface and may block release.
    paraphrase: Peak-load behavior was not exercised, and the recipient needs the saturation risk and safe rollback setting rather than every debugging command.
    near_miss: No unfinished behavior, material risk, drift, or evidence limit can change the recipient's next action.
    nearest_neighbor: agentic-coding.delivery.claim-only-supported-outcome
    expected_behavior: Report the decision-relevant unfinished work, risk, evidence limit, and recovery action with concise reproduction context.
    forbidden_behavior: Hide a release-relevant limit or bury it under harmless warnings, dead ends, and routine logs.

  - id: agentic-coding.correction.restore-authoritative-baseline
    positive_trigger: The user clarifies that a status must be an on-screen badge, not the weekly email inferred from a nearby feature.
    paraphrase: The user removes Agent-added helper text from one screen, and the old route still shapes tests and documentation.
    near_miss: Another Agent reports that scope changed, but no user, maintainer, or accepted specification has authorized that change.
    nearest_neighbor: agentic-coding.recovery.validate-handoff-before-continuation
    expected_behavior: Remove the superseded email or helper-text interpretation everywhere it controls work while preserving requirements the correction did not change.
    forbidden_behavior: Keep part of the rejected route or invent a product-wide ban that the correction never established.

  - id: agentic-coding.context.give-delegated-agents-decision-context
    positive_trigger: Pack examples must show realistic mistakes by capable Agents, a scheduler example was rejected as artificial, and a writer is about to receive only a plan path and generic quality instruction.
    paraphrase: A delegated installer change needs both official and custom registries preserved, but the required reuse, non-goals, checks, and escalation boundary exist only in the parent conversation.
    near_miss: The delegated writer has already returned claims and changed files, so the next decision is whether that handoff is accurate for the current branch.
    nearest_neighbor: agentic-coding.recovery.validate-handoff-before-continuation
    expected_behavior: Send a compact packet with outcome, authority, repository facts, constraints, accepted and rejected choices with reasons, scope, return shape, checks, and escalation triggers.
    forbidden_behavior: Send only a task label, file path, or transcript dump that leaves the receiver to rediscover decisive scope and quality choices.

  - id: agentic-coding.context.write-decision-dense-checkpoint
    positive_trigger: An authorization diagnosis is about to be compacted, while implementation is not authorized and the denial path remains unverified.
    paraphrase: A storage migration pauses after forward migration passes, but populated-data rollback, rejected approaches, and the current commit must survive the pause.
    near_miss: Context has already been lost and the resumed Agent must reopen the request, current files, and recorded results.
    nearest_neighbor: agentic-coding.recovery.reground-after-context-loss
    expected_behavior: Save controlling sources, accepted decisions, first unfinished behavior, current evidence limits, risks, and next action while linking rather than copying logs.
    forbidden_behavior: Preserve recent commands and file activity but omit scope, uncertainty, rejected choices, or unfinished acceptance items.

  - id: agentic-coding.recovery.reground-after-context-loss
    positive_trigger: After compaction, a summary says remote installation is complete even though only a fake transport was tested.
    paraphrase: A resumed parser refactor remembers green core tests but not whether truncated-input recovery was ever exercised.
    near_miss: Compaction is imminent and the current Agent still has enough context to write a reliable checkpoint before the pause.
    nearest_neighbor: agentic-coding.context.write-decision-dense-checkpoint
    expected_behavior: Treat the summary as an index, reopen the controlling request, current artifact, and applicable results, then state what is actually open.
    forbidden_behavior: Continue cleanup or claim completion from remembered or summarized conclusions without checking durable sources.

  - id: agentic-coding.recovery.validate-handoff-before-continuation
    positive_trigger: A migration specialist reports verified rollback, but the cited run covered only forward migration on an earlier commit.
    paraphrase: A delegated rate-limit fix proves one-process bursts while shared-store failover remains unrun on the current branch.
    near_miss: The user has explicitly changed the requirement, so the old route must be removed as an authority correction rather than checked as a handoff claim.
    nearest_neighbor: agentic-coding.correction.restore-authoritative-baseline
    expected_behavior: Check the current request, branch or commit, changed files, and cited result only far enough to support the receiver's next decision.
    forbidden_behavior: Trust another Agent's completion, scope, or test summary because the sender is capable or rerunning the important case is costly.

  - id: agentic-coding.context.recommend-session-handoff
    positive_trigger: Gateway design is accepted and implementation is next; most conversation concerns abandoned tokenizer trials, although no mistake has occurred yet.
    paraphrase: Old investigations now outweigh the few decisions needed for continuation, and the agent must judge whether a compact transfer would remove irrelevant reading without losing accepted conditions.
    near_miss: The session boundary is already fixed and only the checkpoint contents remain open (write-decision-dense-checkpoint). If context was already lost, reground-after-context-loss owns reopening current sources rather than deciding whether to move.
    nearest_neighbor: agentic-coding.context.write-decision-dense-checkpoint
    expected_behavior: Decide from relevance to remaining work and the next phase, not turn count or an observed error. Recommend a move only when a compact record replaces irrelevant history or interference. Map controlling clauses to inline text or precise accessible required-reading locations; preserve independent obligations, conditional outcomes, decision status, and evidence controls. Correct known drift, redact sensitive values, retain historical relative paths when their root is unknown, and provide one usable handoff with a short opener. Continue if the user stays.
    forbidden_behavior: Wait for a mistake, restart solely because a conversation is long, or move when useful history outweighs transfer cost. Replace requirements with topic labels, revive rejected options as accepted work, repeat the history in multiple summaries, invent historical project roots from the current environment, or remove a controlling clause merely to shorten the record.
    # Content and earlier trigger observations have different frozen snapshots; neither proves stable routing.

  - id: agentic-coding.planning.organize-work-around-the-solution
    positive_trigger: Autosave must keep later edits pending when an older save completes, but the agent offers a risk list and proposes disabling editing instead of deciding how acknowledgments relate to revisions.
    paraphrase: Notes must still open when a derived preview is unavailable; the agent recites the outcome but has not used the real viewer contract to form and carry through a workable recovery approach.
    near_miss: The user's intended outcome is still unknown (ground-user-goal). Two designs already satisfy the complete behavior and differ only in extra machinery (choose-smallest-sufficient-design). Whether a proposed scan adds protection is a narrower justify-added-checks decision.
    nearest_neighbor: agentic-coding.implementation.choose-smallest-sufficient-design
    expected_behavior: With the goal understood, form and advance a concrete feasible approach from the facts that change the choice. Obtain only missing decision-critical facts, make technical judgments within the assigned responsibility, and let actual results determine continuation. Solve the difficulty at its cause while preserving other required behavior, safety, authorization, compatibility, and the receiver's assigned judgment. Complete exact small edits directly, deliver the needed judgment for analysis-only work, and leave necessary exploration open.
    forbidden_behavior: Substitute goal repetition, warnings, process, or a convenient passing subset for the decisive work. Escape a hard mechanism by cancelling ordinary capability, silently dropping valid objects, imposing unaccepted design choices on a delegate, or returning false success. Turn every task into a mandatory extra checklist, require complete materials before a targeted decision, or delegate technical choices back to the user without a substantive user tradeoff.
    # A decision-point hypothesis, not a new mandatory workflow or proof of comparative benefit.

  - id: agentic-coding.delivery.lead-with-engineering-conclusion
    positive_trigger: A developer asks whether the reconnect fix is ready; the report recounts searches and edits before finally saying local replay passed but browser reconnect has not been checked.
    paraphrase: A design recommendation lists every benchmark command before giving the chosen indexing approach, its observed read benefit, and the unmeasured production write cost.
    near_miss: The engineering conclusion and its scope already come first, but "credential coordination landed" hides the implemented request-sharing mechanism (explain-engineering-work-plainly). An unsupported production claim needs claim-only-supported-outcome; an omitted release blocker needs report-material-residuals, not a reordered report.
    nearest_neighbor: agentic-coding.delivery.explain-engineering-work-plainly
    expected_behavior: Give the developer the diagnosis, recommendation, implemented result, or actual progress first, with the condition that changes the next action beside it. Follow with the relevant mechanism, evidence, and remaining action; retain units, environments, comparison bases, counterevidence, and uncertainty. Short engineering replies need no headings. State each limit clearly once, do not repeat generic disclaimers, and do not expand a judgment into an unsolicited rollout plan.
    forbidden_behavior: Delay the answer behind work chronology or internal labels; put an unqualified success first and hide a controlling caveat later; turn every reply into a four-section template; delete decisive evidence to be short; or use reordering as a substitute for establishing the supported claim or disclosing a known blocker.

  - id: agentic-coding.delivery.explain-engineering-work-plainly
    positive_trigger: The implementation report says concurrency credential lifecycle coordination is complete, without explaining that simultaneous callers wait for one refresh and share its result.
    paraphrase: An autosave explanation says the persistence lifecycle converges, although the useful fact is that acknowledging revision 12 leaves revision 13 pending.
    near_miss: The mechanism is already concrete but the engineering conclusion comes after two paragraphs of investigation (lead-with-engineering-conclusion). Deciding claim scope belongs to claim-only-supported-outcome, selecting important unresolved issues to report-material-residuals, and editing reusable Practice content to pack-creator.authoring.prefer-plain-language-and-concrete-referents.
    nearest_neighbor: agentic-coding.delivery.lead-with-engineering-conclusion
    expected_behavior: Explain which component reads, writes, waits, rejects, or returns what and why that affects behavior. Keep precise engineering terms and explain unfamiliar project shorthand at first use. Preserve exact paths, commands, error quotations, conditions, quantities, environments, negations, and uncertainty. Separate established mechanism, observed result, and hypothesis; say what is unknown rather than inventing the missing cause.
    forbidden_behavior: Replace a mechanism with an abstract label or blanket success claim, teach specialists unnecessary basics, rewrite protected literals, strengthen a possibility into a guarantee, or reframe engineering collaboration as general everyday advice or a repository-wide prose rewrite.
