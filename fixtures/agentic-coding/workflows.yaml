fixture_set: agentic-coding-workflows
evaluation_only: true
description: Compact cross-Practice behavior scenarios; not a runtime workflow or product protocol.
workflows:
  - id: validation-handoffs-and-real-boundaries
    scenario: HTTP and CSV adapters create the same typed order command; service and repository helpers propose repeated quantity parsing while a concurrent stock reservation still needs atomic protection.
    authoritative_facts:
      - Both external adapters can receive malformed quantities and independently parse their raw inputs.
      - Ordinary private calls pass the parsed quantity unchanged; no unchecked caller reaches those helpers.
      - Available stock can change concurrently after input parsing and preflight checks.
    distractors:
      - Every layer should validate everything so it is robust independently.
      - Validation already happened at ingress, so all database constraints are redundant.
    expected_practices:
      - agentic-coding.implementation.validate-at-the-owning-boundary
      - agentic-coding.implementation.preserve-responsibility-boundaries
      - agentic-coding.testing.assert-observable-behavior
    correctness_assertions:
      - Retain raw-input parsing at HTTP and CSV adapters, pass the agreed representation through private calls, and keep stock decisions with the inventory owner and atomic mutation protection.
      - Valid bulk quantities are neither silently clamped nor rejected by divergent internal rules; malformed raw inputs and concurrent overselling remain rejected at their actual boundaries.
      - Tests protect these observable outcomes without requiring the validator to be called at every layer.
    forbidden_behavior:
      - Add repeated parsers, normalizers, or type casts as substitutes for an established contract.
      - Delete database constraints merely because an ingress parser exists.

  - id: recovery-budget-and-truthful-result
    scenario: A status page may serve a snapshot up to five minutes old during transport outages, but layered clients propose nested retries and an empty result on every exception.
    authoritative_facts:
      - A stale snapshot is accepted only during transport failure and must retain its timestamp and stale indication.
      - Empty data means a successful response containing no failures; it does not mean the data source is unavailable.
      - Permission denial and malformed payloads are not eligible for cache fallback.
    distractors:
      - Broad catch-and-default handling reduces visible error rates.
      - Removing every fallback would shorten the implementation.
    expected_practices:
      - agentic-coding.implementation.make-recovery-behavior-explicit
      - agentic-coding.requirements.define-acceptance-and-non-goals
      - agentic-coding.testing.assert-observable-behavior
    correctness_assertions:
      - Assign one bounded retry owner and do not multiply its attempts in the service or UI.
      - Serve only eligible timestamped cache within the accepted age; exhausted recovery and excluded errors remain distinguishable from empty success.
      - Keep the accepted stale-read mode and verify its visible limits alongside ordinary success.
    forbidden_behavior:
      - Convert denied access, invalid data, or expired cache into empty success.
      - Remove the agreed degraded capability solely to reduce branches.

  - id: authorization-follows-actual-callers
    scenario: An internal service receives an enforced gateway identity, while a separate administration operation can also be reached directly by another tenant's client.
    authoritative_facts:
      - The ordinary internal path has no gateway bypass and passes its established identity unchanged to private helpers.
      - The administration operation has a distinct caller path and requires a resource-specific tenant authorization decision.
    distractors:
      - Internal networking makes every authorization check unnecessary.
      - Every helper needs a separate token exchange in case the network is hostile.
    expected_practices:
      - agentic-coding.implementation.validate-at-the-owning-boundary
      - agentic-coding.planning.admit-only-currently-justified-work
    correctness_assertions:
      - Use the confirmed identity contract for ordinary private calls without inventing another authentication system.
      - Preserve the administration operation's independent tenant check because the caller path and protected resource differ.
    forbidden_behavior:
      - Promote imagined exposure into a new identity platform without a current gap or explicit requirement.
      - Treat an internal address as evidence that independently reachable operations need no authorization.

  - id: recovery-with-operation-specific-prerequisites
    scenario: A local stop command must terminate its known process after an upgrade, but a shared business-API compatibility guard rejects the old process before stop can run.
    authoritative_facts:
      - The contract permits stopping the identified old process when its business API is incompatible.
      - Identity evidence required for the supported stop path is available and must remain checked.
      - Business requests still require the accepted compatibility checks.
    distractors:
      - Reusing one universal guard for business and recovery operations looks simpler.
      - Removing all identity and compatibility checks would make the stop test pass.
    expected_practices:
      - agentic-coding.implementation.make-recovery-behavior-explicit
      - agentic-coding.review.run-subtractive-review-before-commit
    correctness_assertions:
      - Stop depends on the identity and operation prerequisites it actually needs, and works for the identified incompatible process.
      - Keep business compatibility enforcement and reject attempts to stop an unrelated process.
      - Trace the changed stop path without expanding into a repository-wide defensive-code audit.
    forbidden_behavior:
      - Require a successful business query to recover from business incompatibility.
      - Bypass process identity or weaken unrelated business contracts.

  - id: registry-install-overdesign
    scenario: A task requires one additional registry source, but the proposed plan adds arbitrary locators, duplicate parsing, a new abstraction layer, and broad gates for possible future sources.
    authoritative_facts:
      - The accepted capability is installation from the official registry and one explicitly configured repository registry.
      - Existing runtime and dependency capabilities already cover parsing and version comparison.
      - Security and input-budget protections are required and must remain.
    distractors:
      - Arbitrary file and network locators might be useful later.
      - More layers, tests, and documentation would make the change look comprehensive.
    phases:
      - id: before-implementation
        trigger: The plan is about to commit arbitrary locators, duplicate parsing, and broad gates as required work.
        expected_practices:
          - agentic-coding.planning.admit-only-currently-justified-work
          - agentic-coding.planning.scale-work-to-risk-and-cost
          - agentic-coding.planning.define-stop-condition
          - agentic-coding.implementation.inspect-and-reuse-existing-capability
          - agentic-coding.implementation.choose-smallest-sufficient-design
        correctness_assertions:
          - The plan keeps the required repository-registry path and its input protections, defers arbitrary locators, and reuses existing parsing and version comparison.
          - The chosen design adds only the structure needed for the official and explicit repository registries, with a stop condition before a general source protocol.
        forbidden_behavior:
          - Treat more abstractions, checks, files, or a smaller unprotected diff as success.
          - Delete the required registry capability or input protections in the name of simplicity.
      - id: implementation-drift
        trigger: Coding has turned the narrow repository source into a general locator protocol with another parsing path and new security and compatibility work.
        expected_practices:
          - agentic-coding.implementation.replan-on-material-drift
        correctness_assertions:
          - The Agent pauses, compares the new protocol with accepted scope and checks, and either returns to the narrow source or obtains authorization for the larger work.
        forbidden_behavior:
          - Continue adding locators and protections one local edit at a time while the old plan remains unchanged.
      - id: before-commit
        trigger: The completed diff still contains duplicate parsing, unused fallback structure, and the required repository source and input protections.
        expected_practices:
          - agentic-coding.review.run-subtractive-review-before-commit
        correctness_assertions:
          - The final review removes unsupported duplication and fallback structure while preserving the required source and protections, then reruns affected checks.
        forbidden_behavior:
          - Optimize deletion count by removing required custom-registry behavior or security limits while conventional extras remain.

  - id: stale-review-finding
    scenario: A review finding recommends deleting a required custom source as unnecessary and cites an older artifact; the current artifact also contains one separate, local validation defect.
    authoritative_facts:
      - The current requirement explicitly includes the custom source.
      - The cited artifact predates the accepted requirement and current implementation.
      - A current focused check reproduces the local validation defect.
    distractors:
      - The finding is confidently worded and proposes a smaller diff.
      - An older review reported that all relevant checks passed.
    expected_practices:
      - agentic-coding.verification.bind-evidence-to-artifact-state
      - agentic-coding.review.validate-findings-before-action
    expected_behavior:
      - Mark the deletion recommendation stale and conflicting with current authority.
      - Confirm and repair only the current local defect, then gather fresh scoped evidence.
    forbidden_behavior:
      - Apply the entire finding because it is plausible or reject the real local defect because part of the finding is stale.
      - Reuse the old passing review as evidence for the current artifact.

  - id: context-recovery
    scenario: A long task is compacted after a partial slice passes focused checks; the summary says the feature is complete, omits an unverified authorization path, and repeats a rejected design as current.
    authoritative_facts:
      - The current specification requires the authorization path and reload persistence.
      - Focused evidence covers only the visible slice.
      - The repeated design was rejected before compaction.
    distractors:
      - The summary is recent and detailed.
      - Long logs show many passing component checks.
    phases:
      - id: pre-compaction-checkpoint
        trigger: Compaction is imminent while the full task context is still available.
        expected_practices:
          - agentic-coding.context.write-decision-dense-checkpoint
        correctness_assertions:
          - The checkpoint preserves the accepted design, unverified authorization path, evidence scope, and remaining work.
          - The rejected design remains explicitly rejected while raw logs and repeated exploration are omitted.
        forbidden_behavior:
          - Claim completion, omit open acceptance items, or preserve recent discussion volume instead of decision state.
      - id: post-compaction-recovery
        trigger: The session resumes from the inaccurate compact summary and is about to continue editing.
        expected_practices:
          - agentic-coding.recovery.reground-after-context-loss
        correctness_assertions:
          - The agent treats the summary as an index and re-reads the current specification, artifact, and evidence before editing.
          - The rejected design's status is restored and authorization and persistence remain open until fresh evidence covers them.
        forbidden_behavior:
          - Treat the summary as requirement authority, repeat its completion claim, or continue from the rejected design.

  - id: context-starved-delegation
    scenario: A maintainer delegates a Pack fixture rewrite after the user rejected abstract trigger language and an artificial scheduler example. The writer receives only the plan path and target files, so it returns valid YAML that repeats the rejected example and hides the business relationship behind generic terms.
    authoritative_facts:
      - The fixtures must use ordinary, concrete language and show a capable Agent making a locally reasonable choice with a globally wrong result.
      - The user rejected the scheduler example because its causal chain was artificial, even though the authoring plan still says to prefer realistic scenarios in general.
      - The work must preserve 31 canonical IDs and their nearest-neighbor boundaries; schema shape and entry count alone do not demonstrate useful retrieval behavior.
    distractors:
      - The writer can read the general authoring plan and may infer the missing rejection reason.
      - The returned YAML parses and contains all 31 IDs, so accepting it would be faster than reviewing the scenarios.
      - Copying the full parent transcript would guarantee that no sentence is omitted.
    phases:
      - id: before-delegation
        trigger: The writer has not started, and decisive user corrections and rejected interpretations are absent from the files in scope.
        expected_practices:
          - agentic-coding.context.give-delegated-agents-decision-context
        correctness_assertions:
          - The task packet states the concrete language and causal-chain requirements, the rejected scheduler example and why it failed, the 31-ID and nearest-neighbor constraints, the allowed files, the expected return, and the checks the writer owns.
          - The packet links large sources and excludes raw logs, secrets, and unrelated conversation history.
        forbidden_behavior:
          - Delegate with only a task name, file path, or generic instruction to improve quality, or paste the entire transcript without highlighting decisions.
      - id: after-handoff
        trigger: The writer returns changed fixtures and says they are complete and valid.
        expected_practices:
          - agentic-coding.recovery.validate-handoff-before-continuation
        correctness_assertions:
          - The receiver checks the current files, confirms the 31 IDs and neighbor links, and samples scenarios against the concrete failure-mechanism requirement before relying on the completion claim.
          - Any schema or coverage result is limited to the exact artifact checked and is not treated as proof of semantic retrieval quality.
        forbidden_behavior:
          - Treat the original context packet or the writer's summary as proof that the returned scenarios preserve the decisions.
      - id: before-compaction
        trigger: Integrated review is about to pause, and the same task will resume after context reduction.
        expected_practices:
          - agentic-coding.context.write-decision-dense-checkpoint
        correctness_assertions:
          - The checkpoint records the controlling request, accepted scenario boundary, current files, checks that actually ran, unresolved rows, and the next justified review action.
          - It records that the scheduler example remains rejected and why, then links the handoff evidence without copying the delegation transcript.
        forbidden_behavior:
          - Replace the current task state with the original assignment packet, the writer's unverified completion claim, or a chronological command log.

  - id: investigation-expansion
    scenario: A user requests a local settings-page color correction. The Agent finds the page, the shared Button variant it uses, and the color token that variant reads, but it is tempted to map every consumer and surrounding repository area before deciding whether the change is local or shared.
    authoritative_facts:
      - The requested behavior is one visible color correction on the settings page.
      - The direct variant and token define the current color path.
      - A token shared across products can turn a local change into a broader design decision, but unrelated Button consumers cannot decide that by themselves.
    distractors:
      - Reading every Button call site feels safer than choosing from the direct variant and token.
      - Old theme migrations, broad end-to-end suites, and architecture notes are easy to open and make the investigation look thorough.
    phases:
      - id: target-and-direct-dependency-found
        trigger: The page, Button variant, and color token are known, but the Agent is about to open broad code and documentation without a remaining decision that they can change.
        expected_practices:
          - agentic-coding.implementation.limit-investigation-to-current-decision
        correctness_assertions:
          - The Agent names whether the token permits a local override or requires a shared change, then reads only the direct source needed to answer that question.
          - It stops after the edit boundary and focused verification are clear rather than using a caller inventory as reassurance.
        forbidden_behavior:
          - Read every consumer, historical theme implementation, unrelated page style, or broad test suite merely to become familiar with the repository.
      - id: shared-token-boundary-found
        trigger: The direct token source shows that changing it affects multiple product surfaces with an existing design contract.
        expected_practices:
          - agentic-coding.implementation.limit-investigation-to-current-decision
          - agentic-coding.implementation.replan-on-material-drift
        correctness_assertions:
          - The Agent reads the one design contract that can determine whether a shared token change is allowed, then either uses a local override or replans the broader change.
        forbidden_behavior:
          - Continue exploring consumers indefinitely or change the shared token as though the task remained a local color correction.
